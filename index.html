<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARAN API Dokumentation - FNN Variante</title>

    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">

    <style>
        body {
            margin: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .logo-container {
            position: fixed;
            top: 10px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .logo-waran {
            max-height: 60px;
        }

        .logo-bmwe {
            max-height: 180px;
        }

        h2 {
            margin-top: 0;
        }

        #apiSelect {
            padding: 8px;
            min-width: 300px;
            margin-bottom: 20px;
        }

        #swagger-ui {
            display: block;
        }

        #htmlFrame {
            display: none;
            width: 100%;
            height: 900px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="waran.png" alt="WARAN Logo" class="logo-waran">
        <img src="bmwe.svg" alt="BMWE Logo" class="logo-bmwe">
    </div>

    <h2>API-Auswahl</h2>

    <select id="apiSelect">
        <optgroup label="APIs">
            <option value="adHoc.yaml">AdHoc API</option>
            <option value="adHoc_flex_simulator.html">AdHoc Steuerungssimulator</option>
        </optgroup>

        <optgroup label="Dokumentation / Tools">
            <option value="adHoc_flex_simulator.html">Energy Flex Simulator</option>
        </optgroup>
    </select>

    <div id="swagger-ui"></div>

    <iframe id="htmlFrame" title="Dokumentation und Tools"></iframe>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script>
        let ui = SwaggerUIBundle({
            url: "adHoc.yaml",
            dom_id: "#swagger-ui"
        });

        const apiSelect = document.getElementById("apiSelect");
        const swaggerDiv = document.getElementById("swagger-ui");
        const htmlFrame = document.getElementById("htmlFrame");

        apiSelect.addEventListener("change", function() {
            const selected = this.value;

            if (selected.toLowerCase().endsWith(".html")) {
                swaggerDiv.style.display = "none";

                htmlFrame.style.display = "block";
                htmlFrame.src = selected;
            } else {
                htmlFrame.style.display = "none";
                htmlFrame.src = "";

                swaggerDiv.style.display = "block";

                ui.specActions.updateUrl(selected);
                ui.specActions.download(selected);
            }
        });
    </script>

</body>
</html>
