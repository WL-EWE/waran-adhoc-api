  /ruecknahme/adHoc/steuerbefehl/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-05 -> Ruecknahme Ad-hoc-Steuerungen
      description: >
        Erlaubt die Deaktivierung oder das Zurücksetzen von zuvor übermittelten AdHoc Steuerungsprofilen. Es werden alle betroffenen Einträge des Absenders, die nach dem gewünschten Änderungszeitpunkt liegen, im jeweiligen AdHoc Profil adressiert (also gelöscht oder zurückgesetzt). Für die Profile "AdHoc-01" und "AdHoc-03" und "AdHoc-04" bedeutet der Aufruf, dass alle Einträge nach der definierten "adHocStopTime" entfernt werden und somit nicht mehr bzw. nur verkürzt also bis zur Endzeit umgesetzt werden. Für das Softstart Profil "AdHoc-02" gilt eine Besonderheit, hier muss zusätzlich angegeben werden, ob die Werte gelöscht werden sollen (deleteSoftstart=true) oder nur zurückgesetzt werden sollen (deleteSoftstart=false). Das Zuruecksetzen setzt voraus, das ein Softstart aktiviert wurde (diese Information wird über den entsprechenden Informationsdienst "AdHoc-08" transparent gemacht). Das grundsätzliche Softstartprofil bleibtn bei Zuruecksetzen also erhalten und wird nach der nächsten Spannungsunterbrechung erneut aktiviert. 


        Wird keine "adHocStopTime" angegeben, wirkt der Befehl unverzüglich. Betroffen sind immer beide Energierichtungen.

      operationId: postInitialZustand
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
      #  - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialZustandRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /adHoc/preliminaryResponse/v0:
    post:
      tags: [Antwort AdHoc Steuerungshandlung]
      summary: AdHoc-06 -> Vorläufige Antwort
      description: >
       Anpassung und Erweiterung der vorläufigen Rückmeldung. Unter anderem wurden zusätzliche ResponseCodes eingeführt, um eine möglichst präzise Rückmeldung an den auslösenden Akteur zu übermitteln.

       Die vorläufige Antwort wird unmittelbar nach fachlicher Prüfung der Steuerungsanweisung versendet, unabhängig davon, ob die Steuerungseinrichtung den Befehl tatsächlich umsetzen kann.
      operationId: postPreliminaryResponse
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
        - $ref: '#/components/parameters/referenceId'

       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreliminaryResponse'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /adHoc/finalResponse/v0:
    post:
      tags: [Antwort AdHoc Steuerungshandlung]
      summary: AdHoc-07 -> Finale Antwort
      description: >
       Anpassung und Erweiterung der finalen Rückmeldung. Unter anderem wurden zusätzliche ResponseCodes eingeführt, um eine möglichst präzise Rückmeldung an den auslösenden Akteur zu übermitteln.

       Die finale Antwort wird unmittelbar nach erfolgreicher Konfiguration der Steuerungsanweisung versendet, d.h. sobald die Steuerungseinrichtung den Befehl erfolgreich entgegengenommen hat.


       **Hinweis:** Ob die steuerbare Einrichtung auf Kundenseite den Steuerbefehl zum Ausführungszeitpunkt verarbeiten kann und erfolgreich umsetzt, ist mit dieser Antwort nicht sichergestellt.
      operationId: postFinalResponse
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
        - $ref: '#/components/parameters/referenceId'
       # - $ref: '#/components/parameters/controlActor'      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalResponse'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /adHoc/information/v0:
    post:
      tags: [Mitteilung AdHoc Steuerungshandlung an Berechtigte]
      summary: AdHoc-08 -> Information über AdHoc Steuerungshandlungen
      description: >
       Alle erfolgreich verarbeiteten Steuerungshandlungen werden unmittelbar nach der positiven finalen Antwort auch an alle berechtigten Marktpartner übermittelt, sodass eine Transparenz über sämtliche Steuerungsanweisungen besteht. Dabei werden nur die angefragten Steuerungshandlungen transparent gemacht. Die daraus abgeleiteten Residualprofile können über eine separate Status API abgefragt werden, sofern seitens des Absenders daran Bedarf besteht.


       **Besonderheit:** Zusätzlich werden aktivie Softstartsequenzen übermittelt, sobald diese nach Wiederherstellung der Kommunikation vom MSB erkannt werden. Dadurch kann der VNB die laufende Softstartsequenz bei Bedarf beenden.
      operationId: postInformation
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

components:
  responses:
    Accepted: {description: Die Anfrage wurde technisch erfolgreich verarbeitet}
    BadRequest: {description: Die Anfrage ist ungültig}
    Unauthorized: {description: Die Anfrage ist nicht autorisiert}
    NotFound: {description: Ressource nicht gefunden}
    MethodNotAllowed: {description: Methode nicht erlaubt}
    InternalError: {description: Interner Fehler}
  parameters:

    transactionId:
      name: transactionId
      in: header
      description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs des sendenden Marktpartners.
      required: true
      schema:
        type: string
        format: uuid
        example: de14872e-71e7-407f-916f-da8dbde05176
 
    referenceId:
      name: referenceId
      in: header
      description: Externe Vorgangsreferenz zur eindeutigen Identifikation des ursprünglichen Befehls (transactionId aus vorgelagerter Request "Anweisung AdHoc Steuerungshandlung").
      required: true
      schema:
        type: string
        format: uuid
        example: de14872e-71e7-407f-916f-da8dbde05177

    creationDateTime:
      name: creationDateTime
      in: header
      description: Zeitpunkt an dem der Aufruf erstellt wurde
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-07-07T06:58:27.384Z

    initialTransactionId:
      name: initialTransactionId
      in: header
      description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
      required: false
      schema:
        type: string
        format: uuid

   # controlActor:
  #  name: controlActor
  #    in: header
   #   required: true
    #  schema:
     #   type: string
      #  pattern: '^\d{13}$'
       # example: 9900496000005

  schemas:
    PowerLimits:
      type: object
      properties:
        activePowerValue:
          type: number
          format: double
          example: 4.123

        executionTimeFrom:
          type: string
          format: date-time
          example: "2026-08-01T12:30:00Z"

        executionTimeUntil:
          type: string
          format: date-time
          example: "2026-08-01T14:45:00Z"

      required:
        - activePowerValue
        - executionTimeFrom
        - executionTimeUntil
    AdHocReason:
      type: string
      description: >
        Der AdHocReason dient der Transparenz über den Anlass einer Ad-hoc-Steuerung.
        Die Angabe kann für Dokumentations-, Nachweis- und Veröffentlichungspflichten
        verwendet werden. Die Angabe ist zunächst optional/freiwillig.
      enum:
        - LEGAL_REGULATORY
        - CONTRACT
        - TEST
      example: TEST

    AdHocItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'       
        - type: object
          properties:
            maximumPowerValuesConsumption:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PowerLimits'

            maximumPowerValuesProduction:
              type: array
              minItems: 1
              description: Maximale Einspeiseleistung
              items:
                $ref: '#/components/schemas/PowerLimits'

          anyOf:
            - title: Verbrauchslimit (maximumPowerValuesConsumption)
              required:
                - maximumPowerValuesConsumption
            - title: Einspeiselimit (maximumPowerValuesProduction)
              required:
               - maximumPowerValuesProduction

    AdHocRequest:
      $ref: '#/components/schemas/AdHocItem'

    LocationReference:
      type: object
      required:
        - locationId
      properties:
        locationId:
          type: string
          description: Die ID wird durch den BDEW festgelegt. In der vorliegenden Spezifikation wird angenommen, dasss zukünftig ausschließlich über die SR-ID gesteuert wird.
          pattern: '^C[A-Z0-9]{9}[0-9]$'
          example: C1234848431




    PowerInterval:
      type: object
      
      required:
        - activePowerValue
      properties:
        activePowerValue:
          description: Maximale Wirkleistung in kW
          type: number
          format: double
          minimum: 0
          example: 4.200

    ExecutionPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              format: date-time
            executionTimeUntil:
              type: string
              format: date-time
    
    ExecutionInterval:
      allOf:
        - type: object
          required:
            - executionFrom
            - executionUntil
          properties:
            executionFrom:
              type: string
              format: date-time
            executionUntil:
              type: string
              format: date-time

    DurationPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - duration
          properties:
            duration:
              description: Dauer in Sekunden
              type: integer
              example: 900

    PowerIntervalHHMM:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "15:30:00Z"
            executionTimeUntil:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "18:15:00Z"


    communicationFailureItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          properties:
            connectionTimeout:
              type: integer
              minimum: 60
              description: Maximale Dauer eines Kommunikationsausfalls in Sekunden, bevor die Communication-Failure-Werte aktiviert werden.
              example: 120

            wanFailureValuesConsumption:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/DurationPowerInterval'

            wanFailureValuesProduction:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/DurationPowerInterval'

          anyOf:
            - required:
                - wanFailureValuesConsumption
            - required:
                - wanFailureValuesProduction



    communicationFailure:
        $ref: '#/components/schemas/communicationFailureItem'

    SoftstartRequest:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          properties:
            softstartValuesMaxProduction:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DurationPowerInterval'

            softstartValuesMaxConsumption:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DurationPowerInterval'

          anyOf:
            - required:
                - softstartValuesMaxProduction
            - required:
                - softstartValuesMaxConsumption


    FailsafeRequest:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          properties:
            failsafeValueProduction:
              $ref: '#/components/schemas/DurationPowerInterval'

            failsafeValueConsumption:
              $ref: '#/components/schemas/DurationPowerInterval'

          anyOf:
            - required:
                - failsafeValueProduction
            - required:
                - failsafeValueConsumption

    InitialZustandRequest:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - oneOf:
            - type: object
              description: >
                Ruecknahme der Steuerungsanweisung(en) (AdHoc-01),
                der Failsafe-Werte (AdHoc-03) oder der Kommunikationsausfall-Werte (AdHoc-04). Das Feld deleteSofstart darf entfallen
              required:
                - stopProfile
              properties:
                stopProfile:
                  type: string
                  enum:
                    - AdHoc-01
                    - AdHoc-03
                    - AdHoc-04
                adHocStopTime:
                  type: string
                  format: date-time
                  description: Ohne Zeitangabe wird das angegebene Profil schnellstmöglich beendet.


            - type: object
              description: >
                Ruecknahme der Softstart-Werte (AdHoc-02).
                In diesem Fall muss das Feld deleteSofstart angegeben werden.
              required:
                - stopProfile
                - deleteSofstart
              properties:
                stopProfile:
                  type: string
                  enum:
                    - AdHoc-02
                adHocStopTime:
                  type: string
                  format: date-time
                  description: Ohne Zeitangabe wird das angegebene Profil schnellstmöglich beendet.

                deleteSofstart:
                  type: boolean


    PreliminaryResponse:
      allOf:
        - $ref: '#/components/schemas/LocationReference'

        - type: object
          required:
            - preliminaryState
            - preliminaryResponseCode

          properties:
            preliminaryState:
              type: string
              enum:
                - possible
                - unable

            preliminaryResponseCode:
              type: string
              enum:
                - succeeded
                - localFailure
                - communicationFailure
                - customerInteractionRequired
                - overload
                - maintenance
                - missingContract
                - notSupported
                - invalidCommand
                - unable
              description: >
                localFailure = Gerätestörung, wird durch Außendienst behoben;
                customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (z. B. SKI Pairing);
                communicationFailure = Kommunikationsverbindung nicht verfügbar;
                overload = Überlastung der Kommunikationsstrecke;
                maintenance = Wartungsarbeiten, vorübergehend nicht umsetzbar;
                missingContract = Keine gültige Berechtigung;
                notSupported = Anwendungsfall an der Lokation nicht möglich;
                invalidCommand = Nachricht enthält fachliche Fehler;
                unable = Sonstiger Fehler

            preliminaryReason:
              type: string
              example: "Erfolgreich validiert - Umsetzung möglich"

          allOf:
            - if:
                properties:
                  preliminaryState:
                    const: possible
              then:
                properties:
                  preliminaryResponseCode:
                    enum:
                      - succeeded

              else:
                required:
                  - preliminaryReason

                properties:
                  preliminaryResponseCode:
                    enum:
                      - localFailure
                      - communicationFailure
                      - customerInteractionRequired
                      - overload
                      - maintenance
                      - missingContract
                      - notSupported
                      - invalidCommand
                      - unable
    FinalResponse:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          required:
            - adHocState
            - adHocResponseCode

          example:
            locationId: C1234848431
            adHocState: possible
            adHocResponseCode: succeeded
            adHocReason: AdHoc-Residualprofil erfolgreich in der Steuerungseinrichtung aktiviert.
            residualLimits:
              adHocResidualMaxConsumption:
                - executionTimeFrom: "2026-01-01T00:00:00Z"
                  executionTimeUntil: "2026-01-01T01:00:00Z"
                  activePowerValue: 4500
                - executionTimeFrom: "2026-01-01T01:00:00Z"
                  executionTimeUntil: "2026-01-01T02:00:00Z"
                  activePowerValue: 5000
              adHocResidualMaxProduction:
                - executionTimeFrom: "2026-01-01T00:00:00Z"
                  executionTimeUntil: "2026-01-01T01:00:00Z"
                  activePowerValue: 3000

          properties:
            adHocState:
              type: string
              enum:
                - possible
                - unable

            adHocResponseCode:
              type: string
              enum:
                - succeeded
                - localFailure
                - communicationFailure
                - customerInteractionRequired
                - overload
                - maintenance
                - missingContract
                - notSupported
                - invalidCommand
                - unable
              description: >
                succeeded = erfolgreiche Verarbeitung;
                localFailure = Gerätestörung, wird durch Außendienst behoben;
                communicationFailure = temporäre Störung in der Gerätekommunikation;
                customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (z. B. SHIP Pairing);
                overload = Überlastung der Kommunikationsstrecke;
                maintenance = Wartungsarbeiten, vorübergehend nicht umsetzbar;
                missingContract = Keine gültige Berechtigung;
                notSupported = Anwendungsfall an der Lokation nicht möglich;
                invalidCommand = Nachricht enthält fachliche Fehler;
                unable = Sonstiger Fehler.

            adHocReason:
              type: string
              description: Freitext zur Erläuterung des Ergebnisses
              example: "Erfolgreich validiert und in der Steuerungseinrichtung aktiviert."

            residualLimits:
              type: object
              description: Optional berechnete Residualleistungsgrenzen.
              properties:
                adHocResidualMaxConsumption:
                  type: array
                  items:
                    $ref: '#/components/schemas/PowerLimits'

                adHocResidualMaxProduction:
                  type: array
                  description: Liste von Residualprofilen für die maximale Einspeisung.
                  items:
                    $ref: '#/components/schemas/PowerLimits'

          allOf:
            - if:
                properties:
                  adHocState:
                    const: possible
              then:
                properties:
                  adHocResponseCode:
                    enum:
                      - succeeded
              else:
                required:
                  - adHocReason
                properties:
                  adHocResponseCode:
                    enum:
                      - localFailure
                      - communicationFailure
                      - customerInteractionRequired
                      - overload
                      - maintenance
                      - missingContract
                      - notSupported
                      - invalidCommand
                      - unable            

    InformationRequest:
      allOf:
          #- $ref: '#/components/schemas/LocationReference'  
          - type: object     
            required:
              - partnerId
            properties:
              partnerId:
                type: string
                example: 9900496000005
            # adHocEndDate:
            #   type: string
            #   format: date-time
              adHocValues:
                type: array
                items:
                  $ref: '#/components/schemas/AdHocItem'


              
              adHocSoftstart:
                type: array
                items:
                  allOf:
                    - type: object
                      properties:
                        softstartActive:
                          type: boolean
                          description: Wenn eine aktive SoftstartSequenz erkannt wird, wird der Wert auf "True" gesetzt; Andernfalls wird standardmäßig "false" gesendet
                      required:
                        - softstartActive
                    - $ref: '#/components/schemas/SoftstartRequest'

              adHocFailsafe:
                type: array
                items:
                  $ref: '#/components/schemas/FailsafeRequest'
              initialZustand:
                type: array
                items:
                  $ref: '#/components/schemas/InitialZustandRequest'
