openapi: 3.1.3
info:
  title: WARAN - Impuls zur Anpassung der Ad-Hoc-Steuerungs-API (FNN Variante)
  version: 0.9.7
  description: >
    Aufbauend auf dem bereits existierenden API-Webdienst zur prozessualen Abwicklung von Steuerungshandlungen (https://edi-energy.github.io/api-electricity/aktuell-gueltig/#/), werden im vorliegenden Abschnitt Erweiterungen vorgeschlagen, die es den Marktakteuren ermöglichen das volle Potential der Ad-hoc Steuerung zu nutzen. Der Vorschlag orientiert sich an der bisherigen, gültigen Version, ist aber nicht kompatibel da neue Dienste und Strukturen bzw. Bezeichnungen verwendet werden. Es handelt sich somit um einen fachlichen Vorschlag für ein neues Major Release. 
    

    Zur eindeutigen fachlichen Zuordnung der Steuerungsdienste, soll zunächst präzisiert werden, dass die lokale Weitergabe der Ad-hoc Steuerungshandlungen verbrauchsseitig stets über den EEBUS UseCase LPC und einspeiseseitig stets über den EEBUS UseCase LPP erfolgt.* Neben dem kurativen Ad-hoc Eingriff des Netzbetreiber (bspw. nach §14a EnWG) ist es vorgesehen die Steuerungssignale auch im Kontext weiterer netzstabilisierender Maßnahmen zu verwenden. Dazu zählen u.a. Fallbackszenarien, um im Falle von Kommunikationsstörungen oder bei Spannungswiederkehr ein definiertes Verhalten der steuerbaren Anlagen zu gewährleisten. Damit die unterschiedlichen Szenarien konfliktfrei eingesetzt werden können, sind Definitionen und Prioritäten bei der Umsetzung zu berücksichtigen. Die Berücksichtigung der Prioritäten und die Weitergabe der Steuerungshandlungen an die Steuerungseinrichtung bzw. an die steuerbare Einrichtung orientiert sich dabei u.a. an dem VDE FNN Hinweis „Steuerungs-Administration“. Insbesondere das Konzept des Residualprofils wird aufgegriffen und als geeignete Möglichkeit identifiziert, die unterschiedlichen Signale im Backend des Messstellenbetreibers zu harmonisieren. Im aktuellen Abschnitt meint das Ad-hoc Residualprofil dabei die jeweiligen LPC und LPP Werte, die als auszuführendes Array an Werten auf die Steuerungseinrichtung übertragen werden. Die Werte können dabei einen zeitlichen Horizont von mehreren Stunden oder Tagen abdecken. Jeder neue Aufruf sorgt für eine Aktualisierung des Residualprofils.


    *Fokus liegt auf der digitalen Schnittstelle. Insbesondere im Falle von Steuerungsdiensten ist zu erwarten, dass diese das Zielbild und den zukünftigen Standard abdeckt. Die fachliche Ausprägung der Prozesse und API-Dienste sollte daher stets mit Fokus auf die digitale Steuerung gemäß der VDE-AR-E-2829-6-1 erfolgen. Eine Abwärtskompatibilität zum Relais kann für die einfachen Steuersignale in der Regel gewährleistet werden, ist aber nicht Fokus der vorliegenden Spezifikation. 

servers:
  - url: https://api.example.de

tags:
  - name: Anweisung AdHoc Steuerungshandlung
    description: MSB = API-Anbieter (Server)
  - name: Antwort AdHoc Steuerungshandlung
    description: MSB = API-Nutzer (Client)
  - name: Mitteilung AdHoc Steuerungshandlung an Berechtigte
    description: MSB = API-Nutzer (Client)

paths:

  /anweisung/adHoc/steuerbefehl/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-01 ->  Ad-hoc-Steuerung
      description: >
        Abweichend zum bisherigen AdHoc Steuerbefehl, können beide Energierichtung angegeben werden und es können mehrere Anweisungen in einem Aufruf übermittelt werden. Außerdem sind Start- (executionTimeFrom) und Enddatum (executionTimeUntil) beide verpflichtend.
        

        **Mögliche energiewirtschaftliche Szenarien:**
          -	VNB - §14a EnWG „Notfallsignal" -> LPC RP  
          -	VNB - §9 EEG „Notfallsignal“ -> LPP RP
          -	VNB - Redispatch (2.0/3.0) -> LPP RP*
          -	LF – Direktvermarktung u.a. § §10b EEG – LPP RP**

        *Für Redispatch wird (bei Verfügbarkeit) der Hüllkurven Anwendungsfall empfohlen. Durch die Prognosebasis sind Eingriffe in der Regel mit ausreichend Vorlauf bekannt, sodass eine lokale Optimierung auf dem Energiemanagement erreicht werden kann.


        **„Marktliche Steuerung“ durch bspw. Direktvermarkter ist grundsätzlich auch mit Ad-hoc Steuerungssignalen umsetzbar. Es gilt zu beachten, dass der technische Use Case (LPC/LPP) nicht für die marktliche Anwendung bestimmt ist. Missverständnisse bei der Umsetzung, aufgrund der Darstellung als Netzengpasssignal auf der Kundenseite sind zu erwarten. Für die marktliche Steuerung wird daher der Flexband bzw. Hüllkurven Anwendungsfall empfohlen.

        
        **Einschränkung:** der frühste "excecutionTimeFrom" darf maximal 24h in der Zukunft liegen
        
      operationId: postAdHoc
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

 

  /konfiguration/adHoc/softstart/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-02 -> Softstartprofil
      description: >
        Ein Softstart Ad-hoc Profil (LPC/LPP SSt) welches dediziert auf der Steuerungseinrichtung hinterlegt wird und nur bei einer lokalen Spannungsunterbrechung aktiviert wird. Wird mit höchster Priorität ausgeführt und übersteuert somit das Ad-hoc Residualprofil (LPC RP / LPP RP). Sofern die Verbindung zum Backend wieder hergestellt ist, wird ein aktiviertes Softstartprofil über den API Dienst "AdHoc-08" transparent gemacht und kann über den API Dienst "AdHoc-05" zurückgesetzt werden. 
        Die Softstart Profile entsprechen den Steuerungsanwendungsfällen 5 und 6 gemäß Implementierungshinweis des BSI (SAF5 / SAF6). 


        **Mögliche energiewirtschaftliche Szenarien:**
          - VNB - Netzstabilität nach Spannungswiederkehr -> LPC/LPP SSt

        **Einschränkung:** Nur durch den VNB zulässig
      
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftstartRequest'  
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout        


  /konfiguration/adHoc/failsafe/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-03 -> Failsafe-Konfiguration
      description: >
        Konfiguration des Failsafe Werte gemäß EEBUS LPC / LPP Szenario 2. Wird über die Infrastruktur bis zur steuerbaren Anlage durchgereicht und dort bei lokalem Kommunikationsausfall aktiviert.
        Die Failsafe Werte (LPC FS / LPP FS) entsprechen den Steuerungsanwendungsfällen 3 und 4 gemäß Implementierungshinweis des BSI (SAF3 / SAF4).

        
        **Mögliche energiewirtscgaftliche Szenarien:**
          - VNB – Definiertes Verhalten bei einer temporären lokalen Kommunikationsstörung 
          
        **Einschränkung:** Nur durch den VNB zulässig


      operationId: postFailsafe
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailsafeRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /konfiguration/adHoc/wanFailure/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-04 -> Kommunikationsausfall (nur bei FNN Steuerbox)
      description: >
        TBA
        
        **Mögliche energiewirtscgaftliche Szenarien:**
          - VNB – Definiertes Verhalten bei einer WAN-Kommunikationsstörung 
          
        **Einschränkung:** Nur durch den VNB zulässig


      operationId: communicationFailure
      parameters:
